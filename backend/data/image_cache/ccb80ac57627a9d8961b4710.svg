<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d5b7"/>
      <stop offset="1" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="0.5" stop-color="#6b3e1a"/>
      <stop offset="1" stop-color="#4a2810"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a67c52"/>
      <stop offset="1" stop-color="#7a5435"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3a1e"/>
      <stop offset="1" stop-color="#3d2410"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background wall -->
  <rect width="800" height="600" fill="url(#wallGrad)"/>

  <!-- Wainscoting panels -->
  <rect x="0" y="380" width="800" height="120" fill="url(#woodGrad)"/>
  <rect x="20" y="395" width="120" height="90" fill="none" stroke="#3d2410" stroke-width="2"/>
  <rect x="160" y="395" width="120" height="90" fill="none" stroke="#3d2410" stroke-width="2"/>
  <rect x="300" y="395" width="120" height="90" fill="none" stroke="#3d2410" stroke-width="2"/>
  <rect x="440" y="395" width="120" height="90" fill="none" stroke="#3d2410" stroke-width="2"/>
  <rect x="580" y="395" width="120" height="90" fill="none" stroke="#3d2410" stroke-width="2"/>

  <!-- Decorative molding -->
  <rect x="0" y="375" width="800" height="8" fill="#a67c52"/>
  <rect x="0" y="497" width="800" height="6" fill="#3d2410"/>

  <!-- Floor -->
  <rect x="0" y="500" width="800" height="100" fill="url(#floorGrad)"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#4a2810" stroke-width="2"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#4a2810" stroke-width="2"/>
  <line x1="0" y1="590" x2="800" y2="590" stroke="#4a2810" stroke-width="2"/>

  <!-- Coat of arms / emblem on wall behind judge -->
  <g transform="translate(400, 90)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#6b3e1a" stroke-width="3"/>
    <path d="M-20,-10 L-20,20 L20,20 L20,-10 Z" fill="none" stroke="#6b3e1a" stroke-width="2"/>
    <circle cx="0" cy="-5" r="8" fill="none" stroke="#6b3e1a" stroke-width="2"/>
    <path d="M0,3 L-15,15 L-10,25 M0,3 L15,15 L10,25" fill="none" stroke="#6b3e1a" stroke-width="2"/>
  </g>

  <!-- Elevated bench platform -->
  <rect x="80" y="460" width="640" height="45" fill="#4a2810"/>
  <rect x="80" y="455" width="640" height="8" fill="#7a5435"/>

  <!-- The bench (raised desk) -->
  <rect x="200" y="340" width="400" height="120" fill="url(#woodGrad)"/>
  <rect x="200" y="335" width="400" height="10" fill="url(#woodLight)"/>
  <rect x="195" y="340" width="10" height="120" fill="#3d2410"/>
  <rect x="595" y="340" width="10" height="120" fill="#3d2410"/>

  <!-- Bench carved details -->
  <rect x="220" y="400" width="360" height="6" fill="#3d2410" opacity="0.5"/>
  <rect x="220" y="430" width="360" height="6" fill="#3d2410" opacity="0.5"/>

  <!-- Decorative carved panel on bench front -->
  <rect x="280" y="360" width="240" height="35" fill="none" stroke="#3d2410" stroke-width="2"/>
  <line x1="320" y1="360" x2="320" y2="395" stroke="#3d2410" stroke-width="1.5"/>
  <line x1="360" y1="360" x2="360" y2="395" stroke="#3d2410" stroke-width="1.5"/>
  <line x1="400" y1="360" x2="400" y2="395" stroke="#3d2410" stroke-width="1.5"/>
  <line x1="440" y1="360" x2="440" y2="395" stroke="#3d2410" stroke-width="1.5"/>
  <line x1="480" y1="360" x2="480" y2="395" stroke="#3d2410" stroke-width="1.5"/>

  <!-- Judge's chair - high back -->
  <rect x="350" y="200" width="100" height="140" fill="url(#woodGrad)"/>
  <rect x="345" y="195" width="110" height="12" fill="url(#woodLight)"/>
  <rect x="350" y="200" width="100" height="140" fill="none" stroke="#3d2410" stroke-width="2"/>
  <!-- Carved details on chair back -->
  <rect x="365" y="215" width="70" height="20" fill="none" stroke="#3d2410" stroke-width="1.5"/>
  <rect x="365" y="245" width="70" height="20" fill="none" stroke="#3d2410" stroke-width="1.5"/>
  <rect x="365" y="275" width="70" height="20" fill="none" stroke="#3d2410" stroke-width="1.5"/>
  <circle cx="400" cy="310" r="15" fill="none" stroke="#3d2410" stroke-width="1.5"/>

  <!-- Judge figure -->
  <!-- Robe (black) -->
  <path d="M355,335 L355,340 Q345,345 340,360 L335,395 L330,455 L470,455 L465,395 L460,360 Q455,345 445,340 L445,335 Z" fill="#1a1a1a"/>
  <!-- Robe shoulders/collar -->
  <path d="M370,335 Q380,320 400,318 Q420,320 430,335" fill="#1a1a1a"/>
  <!-- White collar bands (legal jabot) -->
  <path d="M388,320 L388,355 L400,348 L412,355 L412,320 Z" fill="#f5f5f0"/>
  <line x1="400" y1="320" x2="400" y2="348" stroke="#d0d0c8" stroke-width="1"/>

  <!-- Head -->
  <ellipse cx="400" cy="295" rx="22" ry="26" fill="#e8c39e"/>
  <!-- Hair (gray, balding style) -->
  <path d="M380,285 Q378,272 385,265 Q390,260 400,260 Q410,260 415,265 Q422,272 420,285" fill="#9a9a9a"/>
  <path d="M380,285 Q378,278 382,272" fill="none" stroke="#7a7a7a" stroke-width="1"/>
  <!-- Ears -->
  <ellipse cx="378" cy="295" rx="4" ry="6" fill="#d4a87e"/>
  <ellipse cx="422" cy="295" rx="4" ry="6" fill="#d4a87e"/>
  <!-- Eyes (looking down at paper) -->
  <path d="M390,298 Q392,300 394,298" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>
  <path d="M406,298 Q408,300 410,298" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>
  <!-- Eyebrows -->
  <path d="M387,290 L396,290" stroke="#5a5a5a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M404,290 L413,290" stroke="#5a5a5a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M399,300 Q397,308 400,310 Q403,308 401,300" fill="none" stroke="#c9a07e" stroke-width="1.2"/>
  <!-- Mouth (slight, focused) -->
  <path d="M395,314 Q400,316 405,314" fill="none" stroke="#a07050" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms reaching forward to write -->
  <path d="M355,355 Q345,365 350,385 L380,395" fill="#1a1a1a"/>
  <path d="M445,355 Q455,365 450,385 L420,395" fill="#1a1a1a"/>
  <!-- Hands -->
  <ellipse cx="378" cy="398" rx="9" ry="7" fill="#e8c39e"/>
  <ellipse cx="422" cy="398" rx="9" ry="7" fill="#e8c39e"/>
  <!-- Sleeve cuffs (white) -->
  <rect x="370" y="388" width="16" height="8" fill="#f5f5f0"/>
  <rect x="414" y="388" width="16" height="8" fill="#f5f5f0"/>

  <!-- Paper / document on bench -->
  <rect x="365" y="375" width="70" height="50" fill="#faf6e8" transform="rotate(-3 400 400)"/>
  <line x1="372" y1="385" x2="428" y2="384" stroke="#9a8a6a" stroke-width="0.8" transform="rotate(-3 400 400)"/>
  <line x1="372" y1="392" x2="425" y2="391" stroke="#9a8a6a" stroke-width="0.8" transform="rotate(-3 400 400)"/>
  <line x1="372" y1="399" x2="420" y2="398" stroke="#9a8a6a" stroke-width="0.8" transform="rotate(-3 400 400)"/>
  <line x1="372" y1="406" x2="422" y2="405" stroke="#9a8a6a" stroke-width="0.8" transform="rotate(-3 400 400)"/>
  <line x1="372" y1="413" x2="415" y2="412" stroke="#9a8a6a" stroke-width="0.8" transform="rotate(-3 400 400)"/>
  <line x1="372" y1="420" x2="418" y2="419" stroke="#9a8a6a" stroke-width="0.8" transform="rotate(-3 400 400)"/>

  <!-- Pen in right hand -->
  <line x1="425" y1="395" x2="445" y2="378" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="425" y1="395" x2="445" y2="378" stroke="#c0a060" stroke-width="1"/>

  <!-- Inkwell on bench -->
  <rect x="490" y="370" width="20" height="25" fill="#2a1a0a"/>
  <ellipse cx="500" cy="370" rx="10" ry="4" fill="#1a0a00"/>
  <rect x="495" y="365" width="10" height="6" fill="#c0a060"/>

  <!-- Nameplate on bench -->
  <rect x="270" y="410" width="100" height="20" fill="#c0a060" stroke="#3d2410" stroke-width="1.5"/>
  <text x="320" y="424" font-family="Georgia, serif" font-size="11" fill="#3d2410" text-anchor="middle" font-style="italic">The Hon. Judge</text>

  <!-- Gavel stand to the side -->
  <g transform="translate(620, 380)">
    <rect x="-5" y="0" width="30" height="12" fill="url(#woodGrad)"/>
    <rect x="0" y="-25" width="6" height="30" fill="#5a3a1a"/>
    <ellipse cx="3" cy="-28" rx="12" ry="6" fill="url(#woodGrad)"/>
  </g>

  <!-- Scale of justice on other side -->
  <g transform="translate(160, 350)">
    <rect x="-2" y="0" width="4" height="50" fill="#c0a060"/>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#c0a060" stroke-width="3"/>
    <line x1="-25" y1="-25" x2="25" y2="-25" stroke="#c0a060" stroke-width="2"/>
    <line x1="-25" y1="-25" x2="-25" y2="-10" stroke="#a07050" stroke-width="1"/>
    <line x1="25" y1="-25" x2="25" y2="-10" stroke="#a07050" stroke-width="1"/>
    <path d="M-35,-10 Q-25,-3 -15,-10 Z" fill="#c0a060"/>
    <path d="M15,-10 Q25,-3 35,-10 Z" fill="#c0a060"/>
    <circle cx="0" cy="-32" r="4" fill="#c0a060"/>
  </g>

  <!-- Desk lamp -->
  <g transform="translate(560, 330)">
    <rect x="-1" y="0" width="2" height="20" fill="#3a2a1a"/>
    <ellipse cx="0" cy="20" rx="6" ry="3" fill="#c0a060"/>
    <path d="M-15,-15 L15,-15 L10,5 L-10,5 Z" fill="#3a2a1a"/>
    <ellipse cx="0" cy="5" rx="10" ry="3" fill="#f5d878"/>
  </g>

  <!-- Lamp glow -->
  <circle cx="560" cy="350" r="60" fill="url(#lampGlow)"/>

  <!-- Soft window light from left -->
  <rect x="0" y="120" width="100" height="200" fill="#fff4d6" opacity="0.15"/>
  <rect x="10" y="130" width="80" height="180" fill="none" stroke="#8a6a4a" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="130" x2="50" y2="310" stroke="#8a6a4a" stroke-width="1.5" opacity="0.4"/>
  <line x1="10" y1="220" x2="90" y2="220" stroke="#8a6a4a" stroke-width="1.5" opacity="0.4"/>

  <!-- Pillars at sides -->
  <rect x="40" y="100" width="30" height="280" fill="url(#woodGrad)"/>
  <rect x="40" y="95" width="30" height="10" fill="#a67c52"/>
  <rect x="40" y="375" width="30" height="10" fill="#a67c52"/>
  <line x1="55" y1="105" x2="55" y2="375" stroke="#3d2410" stroke-width="1" opacity="0.5"/>

  <rect x="730" y="100" width="30" height="280" fill="url(#woodGrad)"/>
  <rect x="730" y="95" width="30" height="10" fill="#a67c52"/>
  <rect x="730" y="375" width="30" height="10" fill="#a67c52"/>
  <line x1="745" y1="105" x2="745" y2="375" stroke="#3d2410" stroke-width="1" opacity="0.5"/>

  <!-- Subtle vignette -->
  <rect width="800" height="600" fill="url(#lampGlow)" opacity="0.3"/>
</svg>