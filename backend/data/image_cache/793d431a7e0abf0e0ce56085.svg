<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background - courtroom wall -->
  <rect x="0" y="0" width="400" height="300" fill="#E8DCC4"/>
  
  <!-- Floor -->
  <rect x="0" y="220" width="400" height="80" fill="#8B6F47"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#6B5235" stroke-width="2"/>
  
  <!-- Wood paneling on lower wall -->
  <rect x="0" y="180" width="400" height="45" fill="#6B4423"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#4A2F18" stroke-width="2"/>
  
  <!-- Judge's bench (background) -->
  <rect x="100" y="80" width="200" height="100" fill="#5C3A1E"/>
  <rect x="95" y="75" width="210" height="10" fill="#4A2F18"/>
  <rect x="110" y="85" width="180" height="80" fill="#6B4423"/>
  
  <!-- Judge silhouette (simplified) -->
  <ellipse cx="200" cy="105" rx="12" ry="14" fill="#3D2817"/>
  <rect x="190" y="118" width="20" height="35" fill="#2C2C2C"/>
  
  <!-- Gavel on bench -->
  <rect x="170" y="155" width="60" height="4" fill="#3D2817"/>
  <rect x="175" y="145" width="20" height="12" fill="#3D2817"/>
  
  <!-- Prosecution table -->
  <rect x="40" y="200" width="160" height="60" fill="#5C3A1E"/>
  <rect x="35" y="195" width="170" height="8" fill="#4A2F18"/>
  <line x1="40" y1="200" x2="40" y2="260" stroke="#3D2817" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="260" stroke="#3D2817" stroke-width="2"/>
  
  <!-- Files on table -->
  <rect x="55" y="185" width="30" height="15" fill="#F5F5DC"/>
  <rect x="90" y="183" width="30" height="17" fill="#E8DCC4"/>
  <line x1="58" y1="190" x2="82" y2="190" stroke="#999" stroke-width="0.5"/>
  <line x1="58" y1="194" x2="82" y2="194" stroke="#999" stroke-width="0.5"/>
  <line x1="93" y1="188" x2="117" y2="188" stroke="#999" stroke-width="0.5"/>
  <line x1="93" y1="192" x2="117" y2="192" stroke="#999" stroke-width="0.5"/>
  
  <!-- Prosecutor body -->
  <!-- Legs -->
  <rect x="85" y="240" width="12" height="40" fill="#2C3E50"/>
  <rect x="103" y="240" width="12" height="40" fill="#2C3E50"/>
  <!-- Shoes -->
  <ellipse cx="91" cy="282" rx="8" ry="4" fill="#1A1A1A"/>
  <ellipse cx="109" cy="282" rx="8" ry="4" fill="#1A1A1A"/>
  
  <!-- Suit jacket -->
  <path d="M 75 200 L 80 180 L 100 165 L 110 165 L 130 180 L 135 200 L 135 245 L 75 245 Z" fill="#1A2332"/>
  
  <!-- White shirt collar -->
  <path d="M 97 165 L 105 175 L 113 165 L 110 168 L 105 172 L 100 168 Z" fill="#FFFFFF"/>
  
  <!-- Tie -->
  <path d="M 103 172 L 107 172 L 109 185 L 105 195 L 101 185 Z" fill="#8B0000"/>
  
  <!-- Arms - one gesturing toward judge -->
  <path d="M 75 200 L 60 210 L 55 225 L 60 228 L 70 220 L 80 215 Z" fill="#1A2332"/>
  <ellipse cx="58" cy="225" rx="6" ry="5" fill="#D4A574"/>
  
  <!-- Right arm at side -->
  <path d="M 135 200 L 140 220 L 138 240 L 132 240 L 130 220 Z" fill="#1A2332"/>
  <ellipse cx="135" cy="242" rx="5" ry="4" fill="#D4A574"/>
  
  <!-- Neck -->
  <rect x="100" y="155" width="10" height="12" fill="#D4A574"/>
  
  <!-- Head -->
  <ellipse cx="105" cy="140" rx="18" ry="22" fill="#D4A574"/>
  
  <!-- Hair -->
  <path d="M 88 130 Q 88 115 105 113 Q 122 115 122 130 L 122 135 Q 115 128 105 128 Q 95 128 88 135 Z" fill="#1A1A1A"/>
  
  <!-- Ear -->
  <ellipse cx="89" cy="142" rx="3" ry="5" fill="#C49964"/>
  
  <!-- Eyebrows -->
  <rect x="96" y="135" width="7" height="2" fill="#1A1A1A"/>
  <rect x="107" y="135" width="7" height="2" fill="#1A1A1A"/>
  
  <!-- Eyes -->
  <ellipse cx="99" cy="141" rx="2" ry="2.5" fill="#1A1A1A"/>
  <ellipse cx="110" cy="141" rx="2" ry="2.5" fill="#1A1A1A"/>
  
  <!-- Nose -->
  <path d="M 105 144 L 103 150 L 107 150 Z" fill="#B89066"/>
  
  <!-- Mouth - speaking -->
  <ellipse cx="105" cy="156" rx="4" ry="2" fill="#8B3A3A"/>
  
  <!-- Glasses -->
  <circle cx="99" cy="141" r="5" fill="none" stroke="#2C2C2C" stroke-width="1"/>
  <circle cx="110" cy="141" r="5" fill="none" stroke="#2C2C2C" stroke-width="1"/>
  <line x1="104" y1="141" x2="105" y2="141" stroke="#2C2C2C" stroke-width="1"/>
  
  <!-- Legal badge/pin -->
  <circle cx="115" cy="190" r="3" fill="#D4AF37"/>
  
  <!-- Scales of justice symbol on wall (small) -->
  <g transform="translate(320, 50)">
    <line x1="15" y1="0" x2="15" y2="20" stroke="#8B7355" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="30" y2="10" stroke="#8B7355" stroke-width="1.5"/>
    <path d="M 0 10 L -5 18 L 5 18 Z" fill="#8B7355"/>
    <path d="M 30 10 L 25 18 L 35 18 Z" fill="#8B7355"/>
  </g>
</svg>