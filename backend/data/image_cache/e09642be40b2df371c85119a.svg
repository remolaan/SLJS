<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background - courtroom -->
  <rect width="400" height="300" fill="#E8DCC4"/>
  <rect x="0" y="0" width="400" height="80" fill="#8B6F47"/>
  <rect x="0" y="80" width="400" height="6" fill="#5C4033"/>
  
  <!-- Window in background -->
  <rect x="280" y="20" width="80" height="50" fill="#B8D4E3" stroke="#5C4033" stroke-width="2"/>
  <line x1="320" y1="20" x2="320" y2="70" stroke="#5C4033" stroke-width="1.5"/>
  <line x1="280" y1="45" x2="360" y2="45" stroke="#5C4033" stroke-width="1.5"/>
  
  <!-- Floor -->
  <rect x="0" y="220" width="400" height="80" fill="#A0826D"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#8B6F47" stroke-width="1"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#8B6F47" stroke-width="1"/>
  
  <!-- Prosecution table (left) -->
  <rect x="20" y="200" width="100" height="20" fill="#6B4423" stroke="#3E2817" stroke-width="1.5"/>
  <rect x="25" y="150" width="10" height="50" fill="#3E2817"/>
  <rect x="105" y="150" width="10" height="50" fill="#3E2817"/>
  
  <!-- Prosecutor figure (left, simplified) -->
  <circle cx="70" cy="125" r="15" fill="#D4A574"/>
  <rect x="58" y="135" width="24" height="30" fill="#2C2C2C"/>
  <rect x="58" y="160" width="24" height="20" fill="#1A1A1A"/>
  <!-- Prosecutor hair -->
  <path d="M 55 120 Q 70 105 85 120 Q 85 115 70 108 Q 55 115 55 120" fill="#1A1A1A"/>
  <!-- Prosecutor gesture -->
  <rect x="82" y="140" width="20" height="6" fill="#D4A574" transform="rotate(20 82 140)"/>
  
  <!-- Defense table (right) - main subject -->
  <rect x="180" y="200" width="140" height="20" fill="#6B4423" stroke="#3E2817" stroke-width="1.5"/>
  <rect x="185" y="150" width="10" height="50" fill="#3E2817"/>
  <rect x="305" y="150" width="10" height="50" fill="#3E2817"/>
  
  <!-- Defense lawyer - main subject -->
  <!-- Head -->
  <circle cx="250" cy="120" r="18" fill="#B8895C"/>
  <!-- Hair -->
  <path d="M 232 115 Q 240 100 250 98 Q 260 100 268 115 Q 268 108 260 102 Q 250 96 240 102 Q 232 108 232 115" fill="#1F1F1F"/>
  <!-- Face details -->
  <circle cx="244" cy="120" r="1.5" fill="#1F1F1F"/>
  <circle cx="256" cy="120" r="1.5" fill="#1F1F1F"/>
  <path d="M 246 128 Q 250 130 254 128" stroke="#1F1F1F" stroke-width="1" fill="none"/>
  
  <!-- Lawyer's body - white shirt and black coat -->
  <rect x="232" y="135" width="36" height="45" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0.5"/>
  <!-- Black advocate's coat/jacket -->
  <path d="M 232 135 L 220 180 L 232 175 L 232 180 L 268 180 L 268 175 L 280 180 L 268 135 Z" fill="#1A1A1A"/>
  <!-- White shirt collar -->
  <path d="M 242 135 L 250 145 L 258 135 L 258 140 L 250 148 L 242 140 Z" fill="#FFFFFF"/>
  <!-- Tie -->
  <path d="M 247 145 L 253 145 L 252 160 L 250 162 L 248 160 Z" fill="#8B0000"/>
  
  <!-- White bands (lawyer's court bands) -->
  <rect x="240" y="158" width="20" height="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="240" y="164" width="20" height="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.5"/>
  
  <!-- Lawyer's arms - one raised gesturing -->
  <rect x="280" y="148" width="30" height="7" fill="#1A1A1A" transform="rotate(-30 280 148)"/>
  <circle cx="306" cy="132" r="5" fill="#B8895C"/>
  <!-- Other arm on table -->
  <rect x="232" y="160" width="20" height="7" fill="#1A1A1A"/>
  <circle cx="232" cy="163" r="5" fill="#B8895C"/>
  
  <!-- Papers on defense table -->
  <rect x="195" y="190" width="20" height="12" fill="#FFFFFF" stroke="#888" stroke-width="0.5"/>
  <line x1="198" y1="194" x2="212" y2="194" stroke="#666" stroke-width="0.3"/>
  <line x1="198" y1="197" x2="210" y2="197" stroke="#666" stroke-width="0.3"/>
  <line x1="198" y1="200" x2="208" y2="200" stroke="#666" stroke-width="0.3"/>
  
  <!-- Gavel on table -->
  <rect x="275" y="190" width="20" height="4" fill="#8B6F47"/>
  <rect x="270" y="192" width="6" height="8" fill="#6B4423"/>
  <rect x="280" y="195" width="15" height="3" fill="#5C4033"/>
  
  <!-- Speech bubble from lawyer -->
  <ellipse cx="350" cy="90" rx="45" ry="30" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/>
  <path d="M 310 100 L 295 115 L 320 105 Z" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="85" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="#333">OBJECTION!</text>
  <text x="350" y="97" font-family="Arial" font-size="7" text-anchor="middle" fill="#555">My client's</text>
  <text x="350" y="106" font-family="Arial" font-size="7" text-anchor="middle" fill="#555">rights...</text>
  
  <!-- Small Sri Lankan flag accent on table -->
  <rect x="220" y="180" width="14" height="10" fill="#8B0000"/>
  <rect x="220" y="185" width="14" height="5" fill="#FFD700"/>
  <rect x="220" y="180" width="14" height="3" fill="#008000"/>
  <rect x="226" y="180" width="4" height="10" fill="#8B4513"/>
  <circle cx="229" cy="185" r="1.2" fill="#FFD700"/>
</svg>