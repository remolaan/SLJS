<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#3a2817"/>
  
  <!-- Background wall paneling -->
  <rect x="0" y="0" width="400" height="280" fill="#5c3d20"/>
  <rect x="0" y="270" width="400" height="10" fill="#2a1a0d"/>
  
  <!-- Wood paneling details -->
  <rect x="20" y="40" width="120" height="220" fill="none" stroke="#3a2817" stroke-width="2"/>
  <rect x="160" y="40" width="120" height="220" fill="none" stroke="#3a2817" stroke-width="2"/>
  <rect x="300" y="40" width="80" height="220" fill="none" stroke="#3a2817" stroke-width="2"/>
  
  <!-- Judge's bench (elevated) -->
  <rect x="80" y="120" width="240" height="20" fill="#2a1a0d"/>
  <rect x="60" y="140" width="280" height="100" fill="#4a2f18"/>
  <rect x="60" y="140" width="280" height="10" fill="#6b4828"/>
  <rect x="60" y="230" width="280" height="10" fill="#2a1a0d"/>
  
  <!-- Judge figure behind bench -->
  <rect x="170" y="80" width="60" height="50" fill="#1a1a1a"/>
  <ellipse cx="200" cy="75" rx="22" ry="25" fill="#d4a574"/>
  <!-- Judge's hair -->
  <path d="M178 65 Q178 50 200 50 Q222 50 222 65 Q222 60 200 60 Q178 60 178 65" fill="#3a2515"/>
  <!-- Judge's robe collar -->
  <path d="M170 95 L200 100 L230 95 L230 110 L170 110 Z" fill="#ffffff"/>
  
  <!-- Court seal on bench -->
  <circle cx="200" cy="185" r="25" fill="none" stroke="#c9a961" stroke-width="2"/>
  <circle cx="200" cy="185" r="18" fill="none" stroke="#c9a961" stroke-width="1"/>
  <text x="200" y="192" font-size="20" fill="#c9a961" text-anchor="middle" font-family="serif">⚖</text>
  
  <!-- Defense counsel - main figure -->
  <!-- Body/robe -->
  <path d="M120 280 L100 380 L260 380 L240 280 Z" fill="#1a1a1a"/>
  <!-- Shoulders -->
  <ellipse cx="180" cy="220" rx="50" ry="18" fill="#1a1a1a"/>
  <!-- White collar/shirt -->
  <path d="M165 215 L195 215 L200 230 L160 230 Z" fill="#ffffff"/>
  <!-- Tie -->
  <path d="M195 220 L205 220 L207 245 L200 250 L193 245 Z" fill="#5c1a1a"/>
  
  <!-- Defense counsel head -->
  <ellipse cx="180" cy="175" rx="28" ry="32" fill="#d4a574"/>
  <!-- Hair -->
  <path d="M152 165 Q152 145 180 143 Q208 145 208 165 Q205 155 180 155 Q155 155 152 165" fill="#2a1a0d"/>
  <!-- Side hair -->
  <path d="M152 165 L150 185 L156 188 L156 170 Z" fill="#2a1a0d"/>
  <path d="M208 165 L210 185 L204 188 L204 170 Z" fill="#2a1a0d"/>
  
  <!-- Face features -->
  <!-- Eyes (looking up toward bench) -->
  <ellipse cx="170" cy="172" rx="3" ry="2" fill="#1a1a1a"/>
  <ellipse cx="190" cy="172" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- Eyebrows raised in earnest plea -->
  <path d="M164 165 Q170 162 176 165" fill="none" stroke="#2a1a0d" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M184 165 Q190 162 196 165" fill="none" stroke="#2a1a0d" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M180 178 L177 188 L183 188 Z" fill="#c99670" opacity="0.5"/>
  <!-- Mouth - speaking/pleading -->
  <ellipse cx="180" cy="195" rx="6" ry="4" fill="#8b3a3a"/>
  <ellipse cx="180" cy="197" rx="5" ry="2" fill="#5a1a1a"/>
  
  <!-- Arm gesturing toward bench -->
  <path d="M210 225 Q250 200 270 170 Q280 155 275 145" fill="none" stroke="#1a1a1a" stroke-width="22" stroke-linecap="round"/>
  <!-- Hand pointing up -->
  <ellipse cx="275" cy="140" rx="10" ry="14" fill="#d4a574" transform="rotate(-20 275 140)"/>
  <!-- Index finger pointing -->
  <rect x="272" y="115" width="6" height="20" fill="#d4a574" rx="3" transform="rotate(-10 275 125)"/>
  
  <!-- Other arm at side -->
  <path d="M150 230 Q135 270 140 310" fill="none" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Paper/documents in hand area -->
  <rect x="130" y="295" width="35" height="45" fill="#f5f1e8" transform="rotate(-10 147 317)"/>
  <line x1="135" y1="305" x2="160" y2="303" stroke="#666" stroke-width="0.5"/>
  <line x1="135" y1="312" x2="160" y2="310" stroke="#666" stroke-width="0.5"/>
  <line x1="135" y1="319" x2="155" y2="317" stroke="#666" stroke-width="0.5"/>
  
  <!-- Floor -->
  <rect x="0" y="380" width="400" height="20" fill="#2a1a0d"/>
  
  <!-- Lectern/podium -->
  <rect x="140" y="260" width="80" height="120" fill="#4a2f18"/>
  <rect x="135" y="255" width="90" height="10" fill="#5c3d20"/>
  <rect x="135" y="375" width="90" height="10" fill="#3a2817"/>
  
  <!-- Name plate on podium -->
  <rect x="155" y="345" width="50" height="12" fill="#c9a961"/>
  <text x="180" y="354" font-size="7" fill="#1a1a1a" text-anchor="middle" font-family="serif" font-weight="bold">DEFENSE</text>
  
  <!-- Gavel on bench -->
  <rect x="80" y="135" width="30" height="6" fill="#8b5a2b"/>
  <rect x="92" y="125" width="6" height="20" fill="#5c3d20"/>
  <rect x="98" y="125" width="6" height="20" fill="#5c3d20"/>
  
  <!-- American flag in background -->
  <rect x="50" y="60" width="40" height="55" fill="#ffffff"/>
  <rect x="50" y="60" width="40" height="6" fill="#b22234"/>
  <rect x="56" y="66" width="6" height="6" fill="#3c3b6e"/>
  <rect x="50" y="72" width="40" height="6" fill="#b22234"/>
  <rect x="50" y="84" width="40" height="6" fill="#b22234"/>
  <rect x="50" y="96" width="40" height="6" fill="#b22234"/>
  <rect x="50" y="108" width="40" height="7" fill="#b22234"/>
  <rect x="50" y="60" width="20" height="35" fill="#3c3b6e"/>
  <rect x="55" y="115" width="35" height="3" fill="#c9a961"/>
  <rect x="55" y="118" width="35" height="3" fill="#c9a961"/>
  <rect x="55" y="121" width="35" height="3" fill="#c9a961"/>
  <line x1="70" y1="55" x2="70" y2="125" stroke="#8b7355" stroke-width="2"/>
  
  <!-- Spotlight effect -->
  <ellipse cx="180" cy="200" rx="150" ry="120" fill="#fff8e1" opacity="0.08"/>
  
  <!-- Speech/plea indicator lines -->
  <path d="M210 195 Q225 180 240 175" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
  <path d="M212 200 Q230 195 245 192" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" stroke-dasharray="2,2"/>
</svg>