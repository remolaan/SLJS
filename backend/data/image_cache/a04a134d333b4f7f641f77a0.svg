<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#f4e4c1"/>
  
  <!-- Wood panel wall -->
  <rect x="0" y="0" width="400" height="280" fill="#8b6f47"/>
  <rect x="0" y="0" width="400" height="280" fill="url(#wood)"/>
  <defs>
    <pattern id="wood" x="0" y="0" width="80" height="280" patternUnits="userSpaceOnUse">
      <rect width="80" height="280" fill="#8b6f47"/>
      <line x1="0" y1="0" x2="0" y2="280" stroke="#6b5235" stroke-width="2"/>
    </pattern>
  </defs>
  
  <!-- Frame oval -->
  <ellipse cx="200" cy="200" rx="150" ry="180" fill="#d4a574"/>
  <ellipse cx="200" cy="200" rx="140" ry="170" fill="#f5deb3"/>
  <ellipse cx="200" cy="200" rx="135" ry="165" fill="#e8d4a8"/>
  
  <!-- Shoulders/Suit -->
  <path d="M 80 360 Q 100 280 140 260 L 260 260 Q 300 280 320 360 Z" fill="#1a1a2e"/>
  
  <!-- Suit lapels -->
  <path d="M 140 260 L 170 320 L 200 280 L 230 320 L 260 260 Z" fill="#0f0f1e"/>
  
  <!-- White collar/shirt -->
  <path d="M 165 260 L 200 290 L 235 260 L 230 320 L 200 310 L 170 320 Z" fill="#ffffff"/>
  <path d="M 175 270 L 200 295 L 225 270 L 220 305 L 200 300 L 180 305 Z" fill="#f8f8f8"/>
  
  <!-- Tie -->
  <path d="M 192 295 L 208 295 L 212 310 L 200 360 L 188 310 Z" fill="#8b0000"/>
  <path d="M 192 295 L 208 295 L 210 305 L 200 312 L 190 305 Z" fill="#6b0000"/>
  
  <!-- Neck -->
  <rect x="180" y="230" width="40" height="40" fill="#c99670"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#d4a574"/>
  
  <!-- Hair (black, neat) -->
  <path d="M 148 160 Q 145 120 175 110 Q 200 100 225 110 Q 255 120 252 160 Q 250 145 240 138 L 235 130 Q 200 115 165 130 L 160 138 Q 150 145 148 160 Z" fill="#1a1a1a"/>
  <path d="M 155 155 Q 160 135 200 125 Q 240 135 245 155 Q 245 145 240 140 Q 200 120 160 140 Q 155 145 155 155 Z" fill="#0a0a0a"/>
  
  <!-- Ears -->
  <ellipse cx="148" cy="185" rx="6" ry="12" fill="#c99670"/>
  <ellipse cx="252" cy="185" rx="6" ry="12" fill="#c99670"/>
  
  <!-- Eyebrows -->
  <path d="M 170 165 Q 180 160 190 165" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 210 165 Q 220 160 230 165" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <ellipse cx="180" cy="180" rx="6" ry="4" fill="#ffffff"/>
  <ellipse cx="220" cy="180" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="180" cy="180" r="3" fill="#3d2817"/>
  <circle cx="220" cy="180" r="3" fill="#3d2817"/>
  <circle cx="181" cy="179" r="1" fill="#000000"/>
  <circle cx="221" cy="179" r="1" fill="#000000"/>
  
  <!-- Nose -->
  <path d="M 200 185 L 195 210 Q 200 215 205 210 Z" fill="#c99670"/>
  <ellipse cx="197" cy="210" rx="2" ry="1.5" fill="#a67c52"/>
  <ellipse cx="203" cy="210" rx="2" ry="1.5" fill="#a67c52"/>
  
  <!-- Mouth (slight composed smile) -->
  <path d="M 185 225 Q 200 230 215 225" stroke="#8b4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 188 226 Q 200 228 212 226" fill="#a0522d"/>
  
  <!-- Cheek shading -->
  <ellipse cx="165" cy="200" rx="10" ry="6" fill="#c88860" opacity="0.4"/>
  <ellipse cx="235" cy="200" rx="10" ry="6" fill="#c88860" opacity="0.4"/>
  
  <!-- Lawyer's lapel pin/badge -->
  <circle cx="155" cy="290" r="5" fill="#d4af37"/>
  <circle cx="155" cy="290" r="3" fill="#b8941f"/>
  
  <!-- Frame outer border -->
  <ellipse cx="200" cy="200" rx="155" ry="185" fill="none" stroke="#6b4423" stroke-width="8"/>
  <ellipse cx="200" cy="200" rx="152" ry="182" fill="none" stroke="#8b6f47" stroke-width="2"/>
</svg>