<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background: courtroom interior -->
  <rect width="400" height="500" fill="#e8dcc4"/>
  
  <!-- Wood paneling background -->
  <rect x="0" y="280" width="400" height="220" fill="#6b4423"/>
  <rect x="0" y="280" width="400" height="8" fill="#3d2817"/>
  <rect x="0" y="350" width="400" height="8" fill="#3d2817"/>
  <rect x="0" y="420" width="400" height="8" fill="#3d2817"/>
  
  <!-- Decorative frame element top -->
  <rect x="0" y="0" width="400" height="60" fill="#3d2817"/>
  <rect x="0" y="55" width="400" height="5" fill="#8b6f47"/>
  <rect x="0" y="60" width="400" height="20" fill="#6b4423"/>
  
  <!-- Decorative columns -->
  <rect x="20" y="80" width="40" height="200" fill="#8b6f47"/>
  <rect x="20" y="80" width="40" height="10" fill="#a08660"/>
  <rect x="20" y="270" width="40" height="10" fill="#a08660"/>
  
  <rect x="340" y="80" width="40" height="200" fill="#8b6f47"/>
  <rect x="340" y="80" width="40" height="10" fill="#a08660"/>
  <rect x="340" y="270" width="40" height="10" fill="#a08660"/>
  
  <!-- Emblem on wall - scales of justice -->
  <g transform="translate(200, 130)">
    <circle cx="0" cy="0" r="35" fill="#c9a961" stroke="#8b6f47" stroke-width="2"/>
    <!-- Scale base -->
    <rect x="-2" y="20" width="4" height="15" fill="#3d2817"/>
    <rect x="-15" y="33" width="30" height="4" fill="#3d2817"/>
    <!-- Scale beam -->
    <rect x="-25" y="-2" width="50" height="3" fill="#3d2817"/>
    <!-- Scale left -->
    <line x1="-25" y1="0" x2="-25" y2="10" stroke="#3d2817" stroke-width="1.5"/>
    <path d="M -35 10 Q -25 18 -15 10 Z" fill="#3d2817"/>
    <!-- Scale right -->
    <line x1="25" y1="0" x2="25" y2="10" stroke="#3d2817" stroke-width="1.5"/>
    <path d="M 15 10 Q 25 18 35 10 Z" fill="#3d2817"/>
    <!-- Top -->
    <circle cx="0" cy="-8" r="3" fill="#3d2817"/>
  </g>
  
  <!-- Body / shoulders - dark suit -->
  <path d="M 80 500 L 80 380 Q 80 340 130 320 L 200 305 L 270 320 Q 320 340 320 380 L 320 500 Z" fill="#1a1a2e"/>
  
  <!-- Suit lapels -->
  <path d="M 200 305 L 165 380 L 175 410 L 200 360 Z" fill="#0d0d1a"/>
  <path d="M 200 305 L 235 380 L 225 410 L 200 360 Z" fill="#0d0d1a"/>
  
  <!-- White collar/shirt -->
  <path d="M 175 320 L 200 365 L 225 320 L 220 310 L 200 315 L 180 310 Z" fill="#f5f5f5"/>
  
  <!-- Tie - red/maroon for prosecutor -->
  <path d="M 195 320 L 205 320 L 210 360 L 200 380 L 190 360 Z" fill="#8b1a1a"/>
  <path d="M 188 360 L 212 360 L 210 365 L 190 365 Z" fill="#6b0f0f"/>
  
  <!-- Neck -->
  <rect x="185" y="280" width="30" height="40" fill="#a87856"/>
  
  <!-- Head - face -->
  <ellipse cx="200" cy="220" rx="55" ry="65" fill="#b88a6a"/>
  
  <!-- Hair - dark, professional -->
  <path d="M 145 200 Q 145 155 200 150 Q 255 155 255 200 Q 255 180 245 170 Q 230 158 200 158 Q 170 158 155 170 Q 145 180 145 200 Z" fill="#1a0f08"/>
  <path d="M 150 195 Q 148 175 165 165 Q 155 185 150 195 Z" fill="#1a0f08"/>
  <path d="M 250 195 Q 252 175 235 165 Q 245 185 250 195 Z" fill="#1a0f08"/>
  
  <!-- Eyebrows - serious -->
  <path d="M 175 205 Q 183 200 192 205" stroke="#1a0f08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 208 205 Q 217 200 225 205" stroke="#1a0f08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Eyes - confident, focused -->
  <ellipse cx="184" cy="220" rx="5" ry="3.5" fill="#ffffff"/>
  <ellipse cx="216" cy="220" rx="5" ry="3.5" fill="#ffffff"/>
  <circle cx="184" cy="220" r="2.5" fill="#2d1810"/>
  <circle cx="216" cy="220" r="2.5" fill="#2d1810"/>
  <circle cx="185" cy="219" r="0.8" fill="#ffffff"/>
  <circle cx="217" cy="219" r="0.8" fill="#ffffff"/>
  
  <!-- Nose -->
  <path d="M 200 230 L 196 250 Q 200 253 204 250 Z" fill="#a87856"/>
  <ellipse cx="197" cy="248" rx="1.5" ry="1" fill="#8b6347"/>
  <ellipse cx="203" cy="248" rx="1.5" ry="1" fill="#8b6347"/>
  
  <!-- Mouth - slight confident smile -->
  <path d="M 188 265 Q 200 270 212 265" stroke="#5c2e1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 188 265 Q 200 268 212 265" fill="#7d3a20"/>
  
  <!-- Jawline shadow -->
  <path d="M 155 250 Q 165 275 200 285 Q 235 275 245 250" fill="none" stroke="#9a6f4f" stroke-width="0.5"/>
  
  <!-- Ears -->
  <ellipse cx="148" cy="225" rx="6" ry="10" fill="#a87856"/>
  <ellipse cx="252" cy="225" rx="6" ry="10" fill="#a87856"/>
  
  <!-- Case file in hand -->
  <g transform="translate(280, 360)">
    <!-- File folder - manila -->
    <rect x="-35" y="0" width="70" height="55" fill="#d4a574" stroke="#8b6f47" stroke-width="1.5"/>
    <!-- Folder tab -->
    <path d="M -20 0 L -20 -8 L 0 -8 L 0 0 Z" fill="#d4a574" stroke="#8b6f47" stroke-width="1.5"/>
    <!-- Documents peeking -->
    <rect x="-30" y="3" width="60" height="50" fill="#f5f5f0" stroke="#8b6f47" stroke-width="0.5"/>
    <!-- Text lines on document -->
    <line x1="-25" y1="10" x2="20" y2="10" stroke="#666" stroke-width="1"/>
    <line x1="-25" y1="16" x2="25" y2="16" stroke="#666" stroke-width="1"/>
    <line x1="-25" y1="22" x2="15" y2="22" stroke="#666" stroke-width="1"/>
    <line x1="-25" y1="28" x2="22" y2="28" stroke="#666" stroke-width="1"/>
    <!-- "STATE" label on folder -->
    <rect x="-25" y="38" width="50" height="12" fill="#8b1a1a"/>
    <text x="0" y="47" font-family="serif" font-size="8" fill="#f5f5f0" text-anchor="middle" font-weight="bold">STATE</text>
  </g>
  
  <!-- Hand holding file -->
  <ellipse cx="250" cy="370" rx="18" ry="22" fill="#a87856"/>
  <path d="M 240 355 Q 245 350 250 352 Q 255 350 260 355" stroke="#8b6347" stroke-width="0.5" fill="none"/>
  
  <!-- Badge on lapel -->
  <g transform="translate(150, 360)">
    <circle cx="0" cy="0" r="8" fill="#c9a961" stroke="#8b6f47" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#8b6f47" stroke-width="0.5"/>
    <path d="M -3 -2 L 0 1 L 3 -2" stroke="#8b6f47" stroke-width="0.8" fill="none"/>
  </g>
  
  <!-- Subtle shadow under face -->
  <ellipse cx="200" cy="285" rx="40" ry="6" fill="#8b6347" opacity="0.3"/>
</svg>