<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a4a"/>
      <stop offset="1" stop-color="#2a3f33"/>
    </linearGradient>
  </defs>
  
  <!-- Background courtroom -->
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Wood paneling -->
  <rect x="0" y="280" width="400" height="120" fill="#5a3a20"/>
  <rect x="0" y="280" width="400" height="8" fill="#3d2614"/>
  <line x1="40" y1="288" x2="40" y2="400" stroke="#4a2e18" stroke-width="2"/>
  <line x1="100" y1="288" x2="100" y2="400" stroke="#4a2e18" stroke-width="2"/>
  <line x1="160" y1="288" x2="160" y2="400" stroke="#4a2e18" stroke-width="2"/>
  <line x1="220" y1="288" x2="220" y2="400" stroke="#4a2e18" stroke-width="2"/>
  <line x1="280" y1="288" x2="280" y2="400" stroke="#4a2e18" stroke-width="2"/>
  <line x1="340" y1="288" x2="340" y2="400" stroke="#4a2e18" stroke-width="2"/>
  
  <!-- Court emblem on wall -->
  <circle cx="200" cy="80" r="30" fill="#d4a849"/>
  <circle cx="200" cy="80" r="24" fill="none" stroke="#8b6914" stroke-width="2"/>
  <path d="M 190 80 Q 200 65 210 80 Q 200 95 190 80 Z" fill="#8b6914"/>
  <rect x="198" y="78" width="4" height="12" fill="#8b6914"/>
  
  <!-- Shoulders/torso - formal attire -->
  <path d="M 80 400 L 80 320 Q 100 270 140 250 L 260 250 Q 300 270 320 320 L 320 400 Z" fill="#1a1a1a"/>
  
  <!-- White shirt collar -->
  <path d="M 170 250 L 170 290 L 200 280 L 230 290 L 230 250 Z" fill="#f5f5f0"/>
  <path d="M 170 250 L 200 260 L 230 250 L 220 245 L 200 250 L 180 245 Z" fill="#e0e0d8"/>
  
  <!-- Tie -->
  <path d="M 195 260 L 205 260 L 208 320 L 200 340 L 192 320 Z" fill="#8b1a1a"/>
  <path d="M 195 260 L 205 260 L 206 270 L 194 270 Z" fill="#6b0f0f"/>
  
  <!-- Lapel/badge area -->
  <rect x="240" y="280" width="30" height="40" fill="#d4a849" rx="2"/>
  <rect x="243" y="285" width="24" height="6" fill="#8b6914"/>
  <rect x="246" y="295" width="18" height="3" fill="#8b6914"/>
  <rect x="246" y="302" width="18" height="3" fill="#8b6914"/>
  <rect x="246" y="309" width="18" height="3" fill="#8b6914"/>
  
  <!-- Neck -->
  <path d="M 180 240 L 180 260 L 220 260 L 220 240 Z" fill="#c9956d"/>
  <path d="M 180 250 Q 200 255 220 250" fill="none" stroke="#a87a55" stroke-width="1"/>
  
  <!-- Head shape -->
  <ellipse cx="200" cy="180" rx="70" ry="85" fill="#c9956d"/>
  
  <!-- Hair - black, short, neat -->
  <path d="M 135 165 Q 130 110 175 95 Q 200 85 225 95 Q 270 110 265 165 Q 265 145 255 135 Q 245 125 230 120 L 170 120 Q 155 125 145 135 Q 135 145 135 165 Z" fill="#1a1a1a"/>
  
  <!-- Hair side detail -->
  <path d="M 135 165 Q 130 180 135 200" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 265 165 Q 270 180 265 200" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Ears -->
  <ellipse cx="132" cy="185" rx="8" ry="15" fill="#b8896a"/>
  <ellipse cx="268" cy="185" rx="8" ry="15" fill="#b8896a"/>
  <path d="M 132 180 Q 130 185 132 195" fill="none" stroke="#8b5a3a" stroke-width="1.5"/>
  <path d="M 268 180 Q 270 185 268 195" fill="none" stroke="#8b5a3a" stroke-width="1.5"/>
  
  <!-- Eyebrows -->
  <path d="M 165 158 Q 175 153 188 156" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 212 156 Q 225 153 235 158" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <ellipse cx="178" cy="175" rx="7" ry="5" fill="#ffffff"/>
  <ellipse cx="222" cy="175" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="178" cy="175" r="4" fill="#3d2817"/>
  <circle cx="222" cy="175" r="4" fill="#3d2817"/>
  <circle cx="179" cy="174" r="1.5" fill="#000"/>
  <circle cx="223" cy="174" r="1.5" fill="#000"/>
  <circle cx="180" cy="173" r="0.8" fill="#fff"/>
  <circle cx="224" cy="173" r="0.8" fill="#fff"/>
  
  <!-- Eyelids -->
  <path d="M 171 173 Q 178 170 185 173" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 215 173 Q 222 170 229 173" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Nose -->
  <path d="M 200 180 Q 195 200 192 215 Q 195 220 200 220 Q 205 220 208 215 Q 205 200 200 180" fill="none" stroke="#a87a55" stroke-width="2"/>
  <ellipse cx="196" cy="216" rx="2" ry="1.5" fill="#8b5a3a"/>
  <ellipse cx="204" cy="216" rx="2" ry="1.5" fill="#8b5a3a"/>
  
  <!-- Mustache -->
  <path d="M 175 230 Q 185 228 195 232 Q 200 234 205 232 Q 215 228 225 230 Q 220 235 210 234 Q 200 236 190 234 Q 180 235 175 230" fill="#1a1a1a"/>
  
  <!-- Mouth -->
  <path d="M 188 245 Q 200 248 212 245" fill="none" stroke="#8b3a3a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Stack of case files being held -->
  <rect x="105" y="320" width="100" height="15" fill="#e8d8a8" stroke="#8b6914" stroke-width="1" transform="rotate(-5 155 327)"/>
  <rect x="108" y="328" width="100" height="15" fill="#d4c890" stroke="#8b6914" stroke-width="1" transform="rotate(-3 158 335)"/>
  <rect x="110" y="336" width="100" height="15" fill="#c8b878" stroke="#8b6914" stroke-width="1" transform="rotate(-1 160 343)"/>
  <rect x="112" y="344" width="100" height="15" fill="#b8a868" stroke="#8b6914" stroke-width="1"/>
  
  <!-- File labels -->
  <rect x="115" y="322" width="20" height="3" fill="#8b1a1a" transform="rotate(-5 125 323)"/>
  <rect x="118" y="330" width="20" height="3" fill="#8b1a1a" transform="rotate(-3 128 331)"/>
  <rect x="120" y="338" width="20" height="3" fill="#8b1a1a" transform="rotate(-1 130 339)"/>
  <rect x="122" y="346" width="20" height="3" fill="#8b1a1a"/>
  
  <!-- Hands holding files -->
  <ellipse cx="100" cy="345" rx="18" ry="22" fill="#c9956d" transform="rotate(-10 100 345)"/>
  <ellipse cx="215" cy="345" rx="18" ry="22" fill="#c9956d" transform="rotate(10 215 345)"/>
  <path d="M 85 340 Q 82 350 88 358" fill="none" stroke="#a87a55" stroke-width="1.5"/>
  <path d="M 95 338 Q 92 348 98 356" fill="none" stroke="#a87a55" stroke-width="1.5"/>
  <path d="M 105 340 Q 102 350 108 358" fill="none" stroke="#a87a55" stroke-width="1.5"/>
  <path d="M 220 340 Q 223 350 217 358" fill="none" stroke="#a87a55" stroke-width="1.5"/>
  <path d="M 210 338 Q 213 348 207 356" fill="none" stroke="#a87a55" stroke-width="1.5"/>
  <path d="M 200 340 Q 203 350 197 358" fill="none" stroke="#a87a55" stroke-width="1.5"/>
  
  <!-- Subtle shadow on face -->
  <path d="M 140 180 Q 145 220 175 240" fill="none" stroke="#b8896a" stroke-width="2" opacity="0.3"/>
</svg>